<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — TradesSnap.us</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0D0F0C;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    :root {
      --black:  #0D0F0C;
      --card:   #181C15;
      --border: #252A20;
      --lime:   #FFD700;
      --muted:  #b8c4ba;
      --red:    #ff4444;
      --green:  #22c55e;
    }
    a { text-decoration: none; color: inherit; }

    .logo {
      font-size: 1.4rem; font-weight: 900; letter-spacing: -0.04em;
      margin-bottom: 32px; text-align: center;
    }
    .logo span { color: var(--lime); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }

    .card-title {
      font-size: 1.5rem; font-weight: 900; letter-spacing: -0.03em;
      margin-bottom: 6px;
    }
    .card-sub {
      font-size: 0.88rem; color: var(--muted); margin-bottom: 28px;
      line-height: 1.5;
    }

    .field { margin-bottom: 20px; }
    label {
      display: block; font-size: 0.8rem; font-weight: 700;
      color: var(--muted); margin-bottom: 6px; letter-spacing: 0.02em;
    }
    input {
      width: 100%; padding: 12px 14px;
      background: #0D0F0C; border: 1px solid var(--border);
      border-radius: 8px; color: #fff; font-size: 0.92rem;
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus { border-color: var(--lime); }
    input::placeholder { color: #444; }

    .btn-primary {
      width: 100%; padding: 13px;
      background: var(--lime); color: #0D0F0C;
      border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 800;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-primary:hover { background: #ffe033; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg {
      background: rgba(255,68,68,0.1); border: 1px solid rgba(255,68,68,0.3);
      color: #ff6b6b; font-size: 0.83rem; border-radius: 8px;
      padding: 10px 14px; margin-bottom: 16px; display: none;
    }
    .error-msg.show { display: block; }

    .success-box {
      display: none;
      text-align: center;
      padding: 8px 0;
    }
    .success-box.show { display: block; }
    .success-icon {
      width: 56px; height: 56px;
      background: rgba(34,197,94,0.15);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      font-size: 1.5rem;
    }
    .success-title {
      font-size: 1.2rem; font-weight: 800; margin-bottom: 8px;
    }
    .success-sub {
      font-size: 0.88rem; color: var(--muted); line-height: 1.6;
    }
    .success-sub strong { color: #fff; }

    .back-link {
      text-align: center; margin-top: 20px;
      font-size: 0.8rem; color: #444;
    }
    .back-link a { color: var(--muted); transition: color 0.2s; }
    .back-link a:hover { color: var(--lime); }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3HN7W8MJMQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3HN7W8MJMQ');
  </script>
</head>
<body>

  <a href="index.html" class="logo">Trades<span>Snap</span>.us</a>

  <div class="card">
    <div id="formView">
      <div class="card-title">Reset your password</div>
      <div class="card-sub">Enter your email and we'll send you a link to set a new password.</div>

      <div class="error-msg" id="errorMsg"></div>

      <form onsubmit="sendReset(event)">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@yourbusiness.com" required />
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Send Reset Link →</button>
      </form>
    </div>

    <div class="success-box" id="successView">
      <div class="success-icon">✉️</div>
      <div class="success-title">Check your inbox</div>
      <div class="success-sub">
        We sent a password reset link to<br>
        <strong id="sentEmail"></strong><br><br>
        Click the link in the email to set a new password. Check your spam folder if you don't see it.
      </div>
    </div>
  </div>

  <div class="back-link">
    <a href="login.html">← Back to sign in</a>
  </div>

<script>
  const SUPABASE_URL = 'https://eqknuetauqvectbkukvu.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxa251ZXRhdXF2ZWN0Ymt1a3Z1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxMjkwMzQsImV4cCI6MjA4ODcwNTAzNH0.pLHYwgQTizC_btUP04NA5_3Lrq8YHiJZ9qSbfKL-oD4';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function sendReset(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('errorMsg');
    const email = document.getElementById('email').value.trim();

    btn.disabled = true;
    btn.textContent = 'Sending…';
    errEl.classList.remove('show');

    const { error } = await db.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html'
    });

    if (error) {
      errEl.textContent = error.message;
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Send Reset Link →';
      return;
    }

    // Show success state
    document.getElementById('sentEmail').textContent = email;
    document.getElementById('formView').style.display = 'none';
    document.getElementById('successView').classList.add('show');
  }
</script>
</body>
</html>
