<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password — TradesSnap.us</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0D0F0C;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    :root {
      --black:  #0D0F0C;
      --card:   #181C15;
      --border: #252A20;
      --lime:   #FFD700;
      --muted:  #b8c4ba;
      --red:    #ff4444;
    }
    a { text-decoration: none; color: inherit; }

    .logo {
      font-size: 1.4rem; font-weight: 900; letter-spacing: -0.04em;
      margin-bottom: 32px; text-align: center;
    }
    .logo span { color: var(--lime); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }

    .card-title {
      font-size: 1.5rem; font-weight: 900; letter-spacing: -0.03em;
      margin-bottom: 6px;
    }
    .card-sub {
      font-size: 0.88rem; color: var(--muted); margin-bottom: 28px;
    }

    .field { margin-bottom: 16px; }
    label {
      display: block; font-size: 0.8rem; font-weight: 700;
      color: var(--muted); margin-bottom: 6px; letter-spacing: 0.02em;
    }
    input {
      width: 100%; padding: 12px 14px;
      background: #0D0F0C; border: 1px solid var(--border);
      border-radius: 8px; color: #fff; font-size: 0.92rem;
      transition: border-color 0.2s; outline: none;
    }
    input:focus { border-color: var(--lime); }
    input::placeholder { color: #444; }

    .strength-bar {
      height: 4px; border-radius: 2px; margin-top: 6px;
      background: var(--border); overflow: hidden;
    }
    .strength-fill {
      height: 100%; width: 0; transition: width 0.3s, background 0.3s;
      border-radius: 2px;
    }
    .strength-label {
      font-size: 0.72rem; color: var(--muted); margin-top: 4px;
    }

    .btn-primary {
      width: 100%; padding: 13px;
      background: var(--lime); color: #0D0F0C;
      border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 800;
      cursor: pointer; transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-primary:hover { background: #ffe033; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg {
      background: rgba(255,68,68,0.1); border: 1px solid rgba(255,68,68,0.3);
      color: #ff6b6b; font-size: 0.83rem; border-radius: 8px;
      padding: 10px 14px; margin-bottom: 16px; display: none;
    }
    .error-msg.show { display: block; }

    .invalid-link {
      text-align: center; display: none;
    }
    .invalid-link.show { display: block; }
    .invalid-link p { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.6; }

    .back-link {
      text-align: center; margin-top: 20px;
      font-size: 0.8rem; color: #444;
    }
    .back-link a { color: var(--muted); transition: color 0.2s; }
    .back-link a:hover { color: var(--lime); }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3HN7W8MJMQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3HN7W8MJMQ');
  </script>
</head>
<body>

  <a href="index.html" class="logo">Trades<span>Snap</span>.us</a>

  <div class="card">
    <div id="formView">
      <div class="card-title">Set new password</div>
      <div class="card-sub">Choose a strong password for your account.</div>

      <div class="error-msg" id="errorMsg"></div>

      <form onsubmit="updatePassword(event)">
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" placeholder="At least 8 characters" required
                 oninput="checkStrength(this.value)" minlength="8" />
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <div class="strength-label" id="strengthLabel"></div>
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Update Password →</button>
      </form>
    </div>

    <div class="invalid-link" id="invalidView">
      <div style="font-size:2rem; margin-bottom:12px;">⚠️</div>
      <div style="font-size:1.2rem; font-weight:800; margin-bottom:8px;">Link expired</div>
      <p>This password reset link has expired or is invalid. Reset links are only valid for 1 hour.</p>
      <a href="forgot-password.html" class="btn-primary" style="display:block; text-align:center; padding:13px; border-radius:10px; font-size:0.95rem; font-weight:800;">Request a new link →</a>
    </div>
  </div>

  <div class="back-link">
    <a href="login.html">← Back to sign in</a>
  </div>

<script>
  const SUPABASE_URL = 'https://eqknuetauqvectbkukvu.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxa251ZXRhdXF2ZWN0Ymt1a3Z1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxMjkwMzQsImV4cCI6MjA4ODcwNTAzNH0.pLHYwgQTizC_btUP04NA5_3Lrq8YHiJZ9qSbfKL-oD4';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Supabase puts the token in the URL hash after redirect
  db.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      // User arrived via valid reset link — form is ready
    } else if (!session && window.location.hash.includes('error')) {
      document.getElementById('formView').style.display = 'none';
      document.getElementById('invalidView').classList.add('show');
    }
  });

  function checkStrength(val) {
    const fill = document.getElementById('strengthFill');
    const label = document.getElementById('strengthLabel');
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const levels = [
      { pct: '25%', color: '#ef4444', text: 'Weak' },
      { pct: '50%', color: '#f97316', text: 'Fair' },
      { pct: '75%', color: '#eab308', text: 'Good' },
      { pct: '100%', color: '#22c55e', text: 'Strong' },
    ];
    const level = levels[score - 1] || { pct: '0%', color: '#ef4444', text: '' };
    fill.style.width = level.pct;
    fill.style.background = level.color;
    label.textContent = level.text;
    label.style.color = level.color;
  }

  async function updatePassword(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('errorMsg');
    const pw = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    errEl.classList.remove('show');

    if (pw !== confirm) {
      errEl.textContent = 'Passwords do not match.';
      errEl.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Updating…';

    const { error } = await db.auth.updateUser({ password: pw });

    if (error) {
      errEl.textContent = error.message;
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Update Password →';
      return;
    }

    // Success — redirect to dashboard
    window.location.href = 'dashboard.html';
  }
</script>
</body>
</html>
