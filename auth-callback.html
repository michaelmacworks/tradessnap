<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signing in… — TradesSnap.us</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0D0F0C;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .logo { font-size: 1.4rem; font-weight: 900; letter-spacing: -0.04em; }
    .logo span { color: #FFD700; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #252A20;
      border-top-color: #FFD700;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 0.88rem; color: #b8c4ba; }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3HN7W8MJMQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3HN7W8MJMQ');
  </script>
</head>
<body>
  <div class="logo">Trades<span>Snap</span>.us</div>
  <div class="spinner"></div>
  <p>Signing you in…</p>

<script>
  const SUPABASE_URL = 'https://eqknuetauqvectbkukvu.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxa251ZXRhdXF2ZWN0Ymt1a3Z1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxMjkwMzQsImV4cCI6MjA4ODcwNTAzNH0.pLHYwgQTizC_btUP04NA5_3Lrq8YHiJZ9qSbfKL-oD4';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Supabase exchanges the token from the URL hash automatically.
  // We just wait for the session to be set, then redirect properly.
  db.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session) {
      const { data: profile } = await db
        .from('profiles')
        .select('onboarding_completed')
        .eq('id', session.user.id)
        .single();

      if (profile && profile.onboarding_completed) {
        window.location.href = 'dashboard.html';
      } else {
        window.location.href = 'onboarding.html';
      }
    }
  });

  // Fallback: if session already exists (page reload), redirect now
  db.auth.getSession().then(({ data: { session } }) => {
    if (session) {
      db.from('profiles')
        .select('onboarding_completed')
        .eq('id', session.user.id)
        .single()
        .then(({ data: profile }) => {
          if (profile && profile.onboarding_completed) {
            window.location.href = 'dashboard.html';
          } else {
            window.location.href = 'onboarding.html';
          }
        });
    }
  });
</script>
</body>
</html>
